<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The font of the pictures: Inter wherever the extension asks for the font of the
     system (system-ui) or for any sans-serif font, so that every run draws the same
     letters. test/harness/run.sh installs it in the Playwright image. -->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
