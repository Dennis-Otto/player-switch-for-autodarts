# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current; a setting here
# wins over the same one there. Preview the website while you write with
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
# https://squidfunk.github.io/mkdocs-material/
INHERIT: .github/mkdocs-blueprint.yml
site_name: "Player Switch for Autodarts"
site_description: "Chrome extension for a shared Autodarts display: everyone plays under their own account and a tap on a tile switches players. Sessions are parked and kept fresh, so nobody signs in again."
# The website of the owner itself lives at the root of its address.
site_url: https://dennis-otto.github.io/player-switch-for-autodarts/
repo_url: https://github.com/Dennis-Otto/player-switch-for-autodarts
repo_name: Dennis-Otto/player-switch-for-autodarts
copyright: "© 2026 Dennis Otto"

# A website in more than one language: the pages of another language sit next to
# their English ones, such as index.de.md beside index.md, and a switch in the header
# changes between them.
plugins:
  search:
    lang: [en, de]
  i18n:
    enabled: true
    languages:
      - locale: en
        name: English
        default: true
        build: true
      - locale: de
        name: Deutsch
        build: true
        # The menu in German; a page without a German one shows the English page.
        nav_translations:
          Home: Start
          A shared display: Gemeinsames Display
          Help: Hilfe
          Security design: Sicherheitsdesign
          Privacy: Datenschutz
          Development: Entwicklung
          Releases: Releases
          Decisions: Entscheidungen

# The menu. A tab in the header for each section.
nav:
  - Home: index.md
  - A shared display: shared-display.md
  - Help: help.md
  - Security design: security.md
  - Privacy: privacy.md
  - Development: development.md
  - Releases: releases.md
  - Decisions: decisions/README.md

# The styles of this website alone, beside those of the blueprint.
extra_css:
  - stylesheets/project.css
