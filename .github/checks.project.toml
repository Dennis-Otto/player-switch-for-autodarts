# The explanations of the checks of this project alone, on top of .github/checks.toml,
# which the blueprint keeps current. When one of them fails, the PR coach shows its
# explanation in the summary of the check, as its annotation and in its comment on the
# pull request, also on a pull request from a fork; scripts/check.sh shows those of its
# steps on your machine too. Explain every check that you add to the required checks
# of .github/repository.project.toml, so that the next person sees how to fix it. The
# comment follows a workflow of this project alone, such as one of visual tests, once
# the answer test_workflows of .copier-answers.yml names it.
# https://github.com/Dennis-Otto/repo-blueprint#the-pr-coach

# A check by the name that GitHub shows, where a * stands for any text. Each has a
# title, problem, why and fix, and may have commands, one per line, and docs, a link or
# a file of the repository with its anchor. Each says in autofix how it fixes itself:
# the commands that fix what it finds, or the reason why no command can. The fix bot
# commits only the fixes of the runs of Lint and of the CI, not yet those of a
# workflow of the project's own (Dennis-Otto/repo-blueprint#225), so a person runs
# the commands of such a check:
# [check."e2e (*)"]
# title = "The end-to-end tests"
# problem = """A test of the whole app in a real browser failed; the summary of the
# check names the test, and its trace shows each step."""
# why = """These tests use the app as its users do, in a real browser."""
# fix = """Run the test that failed on your machine, fix what it shows, and push."""
# commands = ["bash tests/e2e/run.sh"]
# docs = "CONTRIBUTING.md#checks"
# autofix = """A test in a browser that fails needs a person, who knows what the app
# should do."""

# A step of scripts/check.sh by the name that it prints, such as the step that runs
# scripts/check-project.sh, to explain the checks of this project there:
# [step."Checks of this project"]
# problem = """..."""
# why = """..."""
# fix = """..."""
# autofix = ["npm run lint -- --fix"]

[step."Checks of this project"]
problem = """A check of this extension alone failed, and its line in the output names the
file and the message: the version in `extension/manifest.json` differs from the one of
the release bot, a message of `extension/_locales/` is missing in a language, has no
text, shows other placeholders than in English or is used nowhere, the message
`locale` of a language doesn't name its folder, a folder of `extension/_locales/` has a
name that Chrome doesn't read or a missing or invalid `messages.json`, a language has
no store listing `store/listing.<code>.md` or a listing has no language, a language
without its own help page doesn't link the English help, a text or an `aria-label` in a page
differs from its English message, a file
that the manifest names is missing, the help, `docs/help.md` and `docs/help.de.md`,
doesn't quote a message that tells a player about a problem, a job of
`.github/workflows/publish-store.yml` lets its runner reach any host, keeps sudo and
containers, or runs on an image that moves, such as `ubuntu-latest`, the manifest asks
for a permission, a host or a web-accessible page that `store/permissions.json` doesn't
allow, opens the extension wider in another way, or doesn't fit the store
(`scripts/check-manifest.mjs`), or the test of the popup in a browser,
`test/harness/a11y.mjs`, found a problem of accessibility: a rule of axe-core, a control
smaller than 44 by 44 pixels, a text smaller than 12 pixels, a button text that breaks,
or the focus in the wrong place after an action."""
why = """The store ships the manifest with its version, Chrome shows a missing message as
an empty text, and a player who searches the help for the words on the screen has to
find them there, in English and German; a translation that drops a placeholder
drops the name of a player. The jobs of the store workflow hold the token
that publishes a version to every user, so a compromised action or package must not be
able to send it anywhere. Chrome disables an installed extension after an update that
asks for a new permission or host, until someone accepts the new warning in
`chrome://extensions`, and a board display in kiosk mode then stops switching without
a word; and every permission is one more way to the saved sessions and passwords. The
popup is used with a finger on a touch display, with a keyboard and with a screen
reader, which loses its place when the focus falls back to the page."""
fix = """Do what the line says. A new message goes into the list `explained` of
`scripts/check-help.mjs` when it reports a problem or asks a player to act, with an
entry in both help pages that quotes it word for word, and into the list `plain`
otherwise. A job of the store workflow starts with step-security/harden-runner and
`egress-policy: block`, the hosts that it needs in `allowed-endpoints` and
`disable-sudo-and-containers: true`, and runs on a pinned image such as
`ubuntu-24.04`; `docs/releases.md` lists the hosts of each job. A permission, host or
web-accessible page that the extension really needs goes into `store/permissions.json`
with its reason, with a line that justifies it in every store listing,
`store/listing.<code>.md`, and a note in the changelog that the update asks for it;
otherwise take it out of the manifest again. A folder of `extension/_locales/` is
named with a code that Chrome knows, such as `nl` or `pt_BR`, and holds a complete
`messages.json`; add or remove `store/listing.<code>.md` so that every language has one
listing; a language without `docs/help.<code>.md` sets its message `helpUrl` to the
English help. A failed test of the popup names the view
and the element; `npm run test:a11y` runs it alone, in the Chrome or Edge of your
computer. Then run the checks
again:"""
commands = ["bash scripts/check-project.sh"]
docs = "docs/development.md"
autofix = """What a message means and what a player does about it needs a person who
knows the extension, and so does a missing text or file, which hosts a job of the
store workflow needs, and whether the extension may ask for a permission is a decision
of its maintainers."""
