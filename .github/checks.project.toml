# The explanations of the checks of this project alone, on top of .github/checks.toml,
# which the blueprint keeps current. When one of them fails, the PR coach shows its
# explanation in the summary of the check, as its annotation and in its comment on the
# pull request, also on a pull request from a fork; scripts/check.sh shows those of its
# steps on your machine too. Explain every check that you add to the required checks
# of .github/repository.project.toml, so that the next person sees how to fix it. The
# comment follows a workflow of this project alone, such as one of visual tests, once
# the answer test_workflows of .copier-answers.yml names it.
# https://github.com/Dennis-Otto/repo-blueprint#the-pr-coach

# A check by the name that GitHub shows, where a * stands for any text. Each has a
# title, problem, why and fix, and may have commands, one per line, and docs, a link or
# a file of the repository with its anchor. Each says in autofix how it fixes itself:
# the commands that fix what it finds, or the reason why no command can. The fix bot
# commits only the fixes of the runs of Lint and of the CI, not yet those of a
# workflow of the project's own (Dennis-Otto/repo-blueprint#225), so a person runs
# the commands of such a check:
# [check."e2e (*)"]
# title = "The end-to-end tests"
# problem = """A test of the whole app in a real browser failed; the summary of the
# check names the test, and its trace shows each step."""
# why = """These tests use the app as its users do, in a real browser."""
# fix = """Run the test that failed on your machine, fix what it shows, and push."""
# commands = ["bash tests/e2e/run.sh"]
# docs = "CONTRIBUTING.md#checks"
# autofix = """A test in a browser that fails needs a person, who knows what the app
# should do."""

# A step of scripts/check.sh by the name that it prints, such as the step that runs
# scripts/check-project.sh, to explain the checks of this project there:
# [step."Checks of this project"]
# problem = """..."""
# why = """..."""
# fix = """..."""
# autofix = ["npm run lint -- --fix"]

[step."Checks of this project"]
problem = """A check of this extension alone failed, and its line in the output names the
file and the message: a message of `extension/_locales/` is missing in a language, has no
text, shows other placeholders than in English or is used nowhere, the message
`locale` of a language doesn't name its folder, a folder of `extension/_locales/` has a
name that Chrome doesn't read or a missing or invalid `messages.json`, a language has
no store listing `store/listing.<code>.md` or a listing has no language, a language
has no texts for the pictures of the store `store/pictures.<code>.json`, other texts
there than in English or a file there without a language, a picture in `store/images/`
belongs to no language, `docs/releases.md` doesn't list the pictures of a language, the
second screenshot names another number of languages than the extension has, a
language without its own help page doesn't link the English help, a text or an `aria-label` in a page
differs from its English message, a file
that the manifest names is missing, the help, `docs/help.md` and `docs/help.de.md`,
doesn't quote a message that tells a player about a problem, the manifest asks
for a permission, a host or a web-accessible page that `store/permissions.json` doesn't
allow, opens the extension wider in another way, doesn't fit the store, or no longer
runs the same `background.js` in Firefox, under the id and from the versions of Firefox
that it names, with the data that `store/permissions.json` declares
(`scripts/check-extension.mjs`), addons-linter, the linter of addons.mozilla.org, found an
error in the extension or a warning that `scripts/check-firefox.mjs` doesn't accept
with its reason, `extension/` holds a file of no kind that the package knows, two builds
of the zip of one commit differ, or the test of the popup in a browser,
`test/harness/a11y.mjs`, found a problem of accessibility: a rule of axe-core, a control
smaller than 44 by 44 pixels, a text smaller than 12 pixels, a button text that breaks,
or the focus in the wrong place after an action."""
why = """Chrome shows a missing message as
an empty text, a picture of the store shows the words of `store/pictures.<code>.json`
to everyone who looks at the listing in that language, and a player who searches the help for the words on the screen has to
find them there, in English and German; a translation that drops a placeholder
drops the name of a player. Chrome disables an installed extension after an update that
asks for a new permission or host, until someone accepts the new warning in
`chrome://extensions`, and a board display in kiosk mode then stops switching without
a word; and every permission is one more way to the saved sessions and passwords.
Firefox refuses an add-on with an error of addons-linter, and addons.mozilla.org
reviews it with the same rules. The zip of a release goes to the store and handles
passwords, so anybody has to be able to check it against the source of its tag, and only
what the extension loads may reach its users. The
popup is used with a finger on a touch display, with a keyboard and with a screen
reader, which loses its place when the focus falls back to the page."""
fix = """Do what the line says. A new message goes into the list `explained` of
`scripts/check-help.mjs` when it reports a problem or asks a player to act, with an
entry in both help pages that quotes it word for word, and into the list `plain`
otherwise. A permission, host or
web-accessible page that the extension really needs goes into `store/permissions.json`
with its reason, with a line that justifies it in every store listing,
`store/listing.<code>.md`, and a note in the changelog that the update asks for it;
otherwise take it out of the manifest again. A finding of addons-linter names its file,
line and code: fix it, or, for a warning that has to stay, add its code with the reason
to `ACCEPTED` in `scripts/check-firefox.mjs`. A folder of `extension/_locales/` is
named with a code that Chrome knows, such as `nl` or `pt_BR`, and holds a complete
`messages.json`; add or remove `store/listing.<code>.md` so that every language has one
listing; translate the texts of `store/pictures.en.json` into
`store/pictures.<code>.json`, write the new number of languages on the second
screenshot in every `store/pictures.*.json`, add the language to the table in `docs/releases.md` and
delete the pictures of a language that is gone; a language without `docs/help.<code>.md` sets its message `helpUrl` to the
English help. A file in `extension/` of no kind that the package knows goes into `SHIPS`
in `scripts/check-extension.mjs` when the extension loads it, and into `STAYS_OUT` when it
doesn't; two builds that differ have something in the build that depends on the time or
the computer, so compare the two zips, file by file. A failed test of the popup names the view
and the element; `npm run test:a11y` runs it alone, in the Chrome or Edge of your
computer. Then run the checks
again:"""
commands = ["bash scripts/check-project.sh"]
docs = "docs/development.md"
autofix = """What a message means and what a player does about it needs a person who
knows the extension, and so does a missing text or file, which hosts a job of the
store workflow needs, and whether the extension may ask for a permission is a decision
of its maintainers."""

[check."browser"]
title = "The end-to-end tests in Chromium"
problem = """A test of the built extension in Playwright's Chromium, against the fake
Autodarts of `test/e2e/fake/`, failed: the summary of the check names the test and
the line that failed. A test fails as well when a refresh token reached the fake
sign-in service a second time, when a request went to a host that the fake doesn't
answer, when the service worker logged an error, or when it didn't start at all, as
after a wrong path in the manifest or a page, or a permission missing from the
manifest. A step before the tests, such as the checkout or *Download the browser*, fails
with `ECONNREFUSED` when Harden-Runner blocks a host of the job, a new one or an address
that it doesn't know yet; the step *Wait until Harden-Runner lets the hosts through*
warns of it."""
why = """These tests run what Chrome runs and the unit tests don't: the manifest, the
service worker and the content script built into `lib/`, the Autodarts page,
the popup and the switcher. A release with such a failure would break on every
display, and the review of the Chrome Web Store takes days for each fix. A refresh
token sent twice ends the session of a player at Autodarts."""
fix = """Run the tests on your machine, open the trace of the test that failed and fix
what it shows. The trace shows each step with the page, its console and its
requests; the artifact `e2e-<attempt>` of the run has the traces, the screenshots and
the HTML report of the CI. A host that a step before the tests newly needs goes into
`allowed-endpoints` and `HOSTS` of the job, and otherwise the flaky-test bot runs the job
once more by itself. Then push:"""
commands = [
  "npm ci",
  "npx playwright install --no-shell chromium",
  "npm run e2e",
  "npx playwright show-trace test/e2e/results/<test>/trace.zip",
]
docs = "docs/development.md#end-to-end-tests"
autofix = """A test in a browser that fails needs a person who knows what the extension
should do there; no command can make it pass."""

[check."e2e"]
title = "The end-to-end tests"
problem = """The end-to-end tests had to run for this pull request, because it changes
the extension, `src/`, the tests, the packages or `.github/workflows/e2e.yml`, and
they didn't pass: the job *browser* of the workflow E2E failed, was cancelled or
didn't run. Its summary names the test that failed. A job that ran out of time with
every step passed hung at its end, in *Cleaning up orphan processes*, which no change of
the code causes."""
why = """This is the check that `main` requires for the end-to-end tests. They run the
extension as Chrome runs it, against a fake Autodarts, so a broken manifest, import,
message or popup, or a refresh token sent twice, never reaches the Chrome Web Store."""
fix = """Fix the failure that the job *browser* explains, run the tests on your machine
and push; a run that was cancelled or didn't run gets a new one with
*Re-run all jobs* in the workflow E2E:"""
commands = ["npm run e2e"]
docs = "docs/development.md#end-to-end-tests"
autofix = """A test in a browser that fails needs a person who knows what the extension
should do there; no command can make it pass."""

[check."autodarts-contract"]
title = "What the extension relies on at Autodarts"
problem = """Autodarts no longer works the way the extension relies on: the summary of the
check has a table of every part, and for each that changed what it expected, what it
found and every place of the code that relies on it. The parts are the key under
which Autodarts Play keeps its session in `localStorage`, the address of its sign-in
service and the client that it signs in as, all three in the code of
play.autodarts.com; the answer 400 or 401 to a dead session and to a wrong password;
the end of a session; and the forward of play.autodarts.io to play.autodarts.com.
`scripts/upstream-contract.ts` takes the expected values from `src/autodarts.ts`. A
part that got no answer at all may be an outage of Autodarts, which the next run
shows. A job that ran out of time with every step passed hung at its end, in *Cleaning
up orphan processes*, which no change of Autodarts causes."""
why = """None of this is a public contract of Autodarts. When the key or the address
changes, every switch fails on every display, and a sign-in service that answers 404
counts for the extension as an outage, so it keeps retrying and never falls back to a
remembered password. The first to notice would be a player, and a fix needs days in
the review of the Chrome Web Store."""
fix = """Open Autodarts Play in a browser and look at what changed: its developer tools
show the key in `localStorage` and the requests of a sign-in. Change the places that
the summary names, in `src/autodarts.ts`, `src/content.ts` and the manifest,
and the fake Autodarts of the end-to-end tests in `test/e2e/fake/` with them, so that
the tests follow the new behavior. Then run the check against the real Autodarts and
the tests:"""
commands = ["node scripts/upstream-contract.ts", "npm test", "npm run e2e"]
docs = "docs/development.md#what-autodarts-and-the-next-chrome-change"
autofix = """What Autodarts changed, and how the extension follows it, needs a person
who looks at the new Autodarts Play; no command can know it."""

[check."chrome-beta"]
title = "The end-to-end tests in Chrome Beta"
problem = """The end-to-end tests of `test/e2e/` failed in Chrome for Testing Beta, the
next version of Chrome, which reaches the players in about four weeks: the summary of
the check names the version and the test that failed, and the artifact
`chrome-beta-<attempt>` has its trace. The same tests pass in Playwright's Chromium of
the workflow E2E, unless that one failed too. A job that ran out of time with every step
passed hung at its end, in *Cleaning up orphan processes*, which no change of Chrome
causes."""
why = """A version of Chrome that breaks the extension reaches every display by itself.
These four weeks are the time to fix the extension, or to report the bug to Chrome,
before a player notices; a fix needs days in the review of the Chrome Web Store as
well."""
fix = """Run the tests in the same Beta on your machine and fix what the trace shows. A
change of Chrome that is a bug of Chrome goes to https://issues.chromium.org with the
smallest test that shows it:"""
commands = [
  "npm ci",
  "E2E_CHROME_PATH=\"$(bash scripts/chrome-for-testing.sh Beta)\" npm run e2e",
  "npx playwright show-trace test/e2e/results/<test>/trace.zip",
]
docs = "docs/development.md#what-autodarts-and-the-next-chrome-change"
autofix = """A test that fails in the next Chrome needs a person who knows what the
extension should do there; no command can make it pass."""
