<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player Switch for Autodarts: social preview</title>
<!-- scripts/social-preview.sh renders this page into the 1280×640 image that GitHub
     shows for links to the repository. The right side is the real switcher on a board
     display, docs/images/switcher.dark.png, which scripts/screenshots.sh renders from the
     extension's own page before it renders this one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body {
  /* The accent of the extension's dark theme, extension/popup.css. */
  --accent: #8ea2ff;
  position: relative;
  font-family: "Inter", "Liberation Sans", "FreeSans", sans-serif;
  color: #f8fafc;
  background:
    radial-gradient(720px 520px at 74% 52%, rgba(67, 89, 240, 0.20), transparent 70%),
    linear-gradient(135deg, #0a0f1d 0%, #0d1328 55%, #0b1222 100%);
}
.text { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
.icon { width: 112px; height: 112px; display: block; border-radius: 24px; }
h1 { margin-top: 40px; font-size: 64px; font-weight: 800; line-height: 1.05; letter-spacing: -0.025em; color: #ffffff; }
h2 { margin-top: 6px; font-size: 40px; font-weight: 700; color: var(--accent); letter-spacing: -0.015em; }
ul { margin-top: 40px; list-style: none; display: grid; gap: 16px; }
li { font-size: 25px; line-height: 1.3; color: #cbd5e1; padding-left: 30px; position: relative; }
li::before { content: ""; position: absolute; left: 0; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
/* The switcher over the scoreboard of a board display: the whole picture, 1440×900. */
.display {
  position: absolute; right: 56px; top: 50%; transform: translateY(-50%); width: 592px; height: 370px;
  border-radius: 18px; overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.10);
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 90px rgba(67, 89, 240, 0.22);
}
.display img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="text">
  <img class="icon" src="../extension/icons/icon-128.png" alt="">
  <h1>Player Switch</h1>
  <h2>for Autodarts</h2>
  <ul>
    <li>Everyone plays on their own account</li>
    <li>One tap to switch, nobody signs in again</li>
    <li>For Chrome, Edge and Firefox</li>
  </ul>
</div>
<div class="display"><img src="../docs/images/switcher.dark.png" alt=""></div>
</body>
</html>
