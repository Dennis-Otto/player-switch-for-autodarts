<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player Switch for Autodarts: social preview</title>
<!-- scripts/social-preview.sh renders this page into the 1280×640 image that GitHub
     shows for links to the repository. The right side is the real popup of the extension,
     docs/images/lobby.dark.png, which scripts/screenshots.sh renders from the extension's
     own page before it renders this one: large, below a drawn piece of a browser's
     toolbar with the icon that opens it. The layout toolbar of test/harness/stage.css
     draws the same toolbar for docs/images/popup.dark.png, the picture of the cards of
     the website in other languages: change both together. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body {
  /* The accent of the extension's dark theme, extension/popup.css. */
  --accent: #8ea2ff;
  position: relative;
  font-family: "Inter", "Liberation Sans", "FreeSans", sans-serif;
  color: #f8fafc;
  background:
    radial-gradient(720px 520px at 74% 52%, rgba(67, 89, 240, 0.20), transparent 70%),
    linear-gradient(135deg, #0a0f1d 0%, #0d1328 55%, #0b1222 100%);
}
.text { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
.icon { width: 112px; height: 112px; display: block; border-radius: 24px; }
h1 { margin-top: 40px; font-size: 64px; font-weight: 800; line-height: 1.05; letter-spacing: -0.025em; color: #ffffff; }
h2 { margin-top: 6px; font-size: 40px; font-weight: 700; color: var(--accent); letter-spacing: -0.015em; }
ul { margin-top: 40px; list-style: none; display: grid; gap: 16px; }
li { font-size: 25px; line-height: 1.3; color: #cbd5e1; padding-left: 30px; position: relative; }
li::before { content: ""; position: absolute; left: 0; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }

/* The right end of a browser's toolbar, which fades in from the left: the address, the
   extension's icon, pressed as while its popup is open, the menu of the extensions and
   the browser's menu. */
.toolbar {
  position: absolute; left: 612px; right: 40px; top: 14px; height: 56px;
  display: flex; align-items: center; gap: 4px; padding: 0 10px 0 22px;
  border-radius: 16px; background: #1a1f30;
  border: 1px solid rgba(255, 255, 255, 0.08);
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 90px);
  mask-image: linear-gradient(to right, transparent 0, #000 90px);
}
.address {
  flex: 1; height: 38px; margin-right: 12px; display: flex; align-items: center;
  padding-left: 64px; border-radius: 19px; background: #0e1220;
  font-size: 19px; font-weight: 500; color: #aeb6c8;
}
.button { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; }
.button svg { width: 24px; height: 24px; fill: none; stroke: #aeb6c8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.button.pressed { background: rgba(142, 162, 255, 0.22); box-shadow: inset 0 0 0 1.5px rgba(142, 162, 255, 0.6); }
.button.pressed img { width: 26px; height: 26px; display: block; border-radius: 6px; }

/* The popup hangs from the icon, and the notch points at it. The right edge keeps its
   place, so the notch stays below the icon however wide the popup becomes. */
.popup { position: absolute; right: 72px; top: 82px; }
.notch {
  position: absolute; right: 78px; top: -9px; width: 18px; height: 18px; transform: rotate(45deg);
  /* The background of the popup in its dark theme, extension/popup.css. */
  background: #14161d; border-radius: 3px 0 0 0;
  box-shadow: -1.5px -1.5px 0 rgba(255, 255, 255, 0.12);
}
/* The picture at 0.7 of its size: 1.4 times the popup, whose pixels it has twice. The
   margins take away the frame around the popup, 28 pixels of test/harness/stage.css at
   that scale of 2, so the box is the popup and keeps the popup's size. The bottom of the
   preview cuts off what no longer reads at the size of a link card. */
.window {
  zoom: 0.7; width: fit-content; overflow: hidden; border-radius: 28px;
  box-shadow:
    0 0 0 1.5px rgba(255, 255, 255, 0.12),
    0 40px 100px rgba(0, 0, 0, 0.6),
    0 0 130px rgba(67, 89, 240, 0.25);
}
.window img { display: block; margin: -56px; }
</style>
</head>
<body>
<div class="text">
  <img class="icon" src="../extension/icons/icon-128.png" alt="">
  <h1>Player Switch</h1>
  <h2>for Autodarts</h2>
  <ul>
    <li>Everyone plays on their own account</li>
    <li>One tap to switch, nobody signs in again</li>
    <li>For Chrome, Edge and Firefox</li>
  </ul>
</div>
<div class="toolbar">
  <div class="address">play.autodarts.com</div>
  <div class="button pressed"><img src="../extension/icons/icon-48.png" alt=""></div>
  <div class="button"><svg viewBox="0 0 24 24"><path d="M5.25 7.75h3a2.5 2.5 0 1 1 5 0h3v3a2.5 2.5 0 1 1 0 5v3h-11Z"/></svg></div>
  <div class="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="0.9"/><circle cx="12" cy="12" r="0.9"/><circle cx="12" cy="18.5" r="0.9"/></svg></div>
</div>
<div class="popup">
  <div class="window"><img src="../docs/images/lobby.dark.png" alt=""></div>
  <div class="notch"></div>
</div>
</body>
</html>
