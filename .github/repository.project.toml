# The settings of this repository on top of .github/repository.toml, which the
# blueprint keeps current. blueprint.py and the settings bot add them: tables merge,
# lists gain their new items, and values replace those of repository.toml.
# https://github.com/Dennis-Otto/repo-blueprint#settings-as-code

# Checks that only this project runs: its end-to-end tests, whose job "e2e" of
# .github/workflows/e2e.yml passes in seconds for a pull request that changes nothing
# that they run.
[branch]
required_checks = ["e2e"]

# An environment of this project and the secrets it needs:
# [environments.deploy]
# secrets = ["DEPLOY_TOKEN"]

# A browser extension is loaded unpacked or from a zip, not published to npm, so the
# release bot builds and signs the release, with the zip of scripts/release-assets.sh, but
# delivers it nowhere; publish-store.yml takes that zip to the Chrome Web Store.
[variables]
PUBLISH_TO = "none"

# The Chrome Web Store, to which publish-store.yml delivers every release, from main
# alone. The workflow signs in with the OIDC token of GitHub through the repository
# variables CWS_WORKLOAD_IDENTITY_PROVIDER and CWS_SERVICE_ACCOUNT (decision 0010), so
# this environment holds no secret; the table keeps the environment to main. The IDs of
# the item and of the publisher are the repository variables CWS_EXTENSION_ID and
# CWS_PUBLISHER_ID. All four variables are set by hand, as docs/releases.md describes.
[environments.chrome-web-store]
