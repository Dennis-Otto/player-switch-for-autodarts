name: Issue assistant

# A first analysis of new issues, the labels of the issue forms and the answers that
# the assistant or the maintainer waits for: https://github.com/Dennis-Otto/issue-assistant
#
# The jobs are the issue assistant's reusable workflow at the commit of a release, so
# an update is a move of the pin below. event and apply run no AI; analyze runs the
# engine of .github/issue-assistant/config.toml with a read-only token and read-only
# tools on the egress-firewall runner (.github/egress-firewall.yaml), and apply
# checks its answer before anything is written. The permissions below are the most
# that any of its jobs gets.
#
# Without the engine's secret in the environment issue-assistant, or with the
# repository variable ISSUE_ASSISTANT_AI set to "off", only labels and the lifecycle
# work. The issue assistant's check command keeps this file equal to its template.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue
        required: true
        type: number
      mode:
        description: Task of the assistant
        type: choice
        options: [triage, follow-up, maintainer-reply, release-reply, maintainer-question]
        default: triage
      dry_run:
        description: Only show what the assistant would do
        type: boolean
        default: true

permissions: {}

# The runs of one issue run one after the other. Up to 100 wait their turn, first
# in, first out, so an answer written while an analysis runs is never dropped.
concurrency:
  group: issue-assistant-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
  queue: max

jobs:
