      - name: Analyze with Claude
        id: claude
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'claude'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Issues come from people without write access. The token is the job's
          # read-only GITHUB_TOKEN, and Claude can only read files of the checkout.
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          prompt: ${{ steps.context.outputs.prompt }}
          # --restricted removes every tool that runs code or reaches the network,
          # ignores settings files and confines the file tools to the checkout;
          # --tools leaves only the reading tools, and nothing ever prompts.
          claude_args: |
            --restricted
            --tools "Read,Grep,Glob"
            --permission-prompts none
            --model ${{ steps.engine.outputs.model }}
            --max-turns 40
            --json-schema '${{ steps.context.outputs.schema }}'

  apply:
    name: Check and post the analysis
    needs: [event, analyze]
    if: needs.analyze.outputs.answer != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
