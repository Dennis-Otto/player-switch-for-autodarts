name: Chrome Web Store

# Delivers each release to the Chrome Web Store, where Google reviews it and then
# publishes it. The release bot publishes a release with the GITHUB_TOKEN, whose
# events start no workflow, so this one starts after every run of the Release
# workflow that a push or a start by hand began, and by hand with a tag. It takes
# the latest published release and asks the store which version it has; a version
# that the store has already, under review or published, ends the run with a note.
# Otherwise it builds the upload zip from the tag with scripts/package-extension.sh,
# checks that the manifest carries the version of the release, keeps the zip as an
# artifact of the run for 30 days, uploads it with the Chrome Web Store API and
# submits it for review. The OAuth client and the refresh token of the developer
# account are the secrets of the environment chrome-web-store, the IDs of the item
# and of the publisher the variables CWS_EXTENSION_ID and CWS_PUBLISHER_ID;
# docs/releases.md describes the one-time set-up.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release; empty for the latest
        required: false

permissions: {}

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    name: the release to deliver
    # A failed run of the Release workflow published no release, and its hourly runs
    # from the schedule publish none either.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The secrets of the store, to ask it; the delivery below is the deployment.
    environment:
      name: chrome-web-store
      deployment: false
    permissions:
      contents: read
    env:
      # The item in the Chrome Web Store API: https://developer.chrome.com/docs/webstore/api
      ITEM: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
    outputs:
      tag: ${{ steps.store.outputs.tag }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The latest release: published, no draft, no prerelease.
          tag="${INPUT_TAG:-$(gh release view --json tagName --jq .tagName 2>/dev/null || true)}"
          if [[ -z "$tag" ]]; then
            echo "The repository has no release yet." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          state="$(gh release view "$tag" --json isDraft,isPrerelease \
            --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "release" end')"
          case "$state" in
            draft)
              echo "::error::The release $tag is still a draft."
              exit 1
              ;;
            prerelease)
              # A prerelease is for the testers who take one; the store gets releases only.
              echo "The prerelease $tag stays off the store." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the set-up of the environment
        if: steps.release.outputs.tag != ''
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          missing=0
          for secret in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::The secret $secret of the environment chrome-web-store is missing; docs/releases.md says how to set it."
              missing=1
            fi
          done
          for variable in CWS_EXTENSION_ID CWS_PUBLISHER_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::The variable $variable is missing; docs/releases.md says how to set it."
              missing=1
            fi
          done
          exit "$missing"
      - name: Sign in to the Chrome Web Store API
        if: steps.release.outputs.tag != ''
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # An access token of an hour from the refresh token. It goes into a file of the
          # job for the steps below, so that it is in no log and no environment.
          response="$RUNNER_TEMP/token.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 60 --output "$response" \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token \
            https://oauth2.googleapis.com/token ||
            { cat "$response"; echo "::error::Google issued no access token; the refresh token may have expired."; exit 1; }
          token="$(jq -r '.access_token // empty' "$response")"
          rm -f "$response"
          if [[ -z "$token" ]]; then
            echo "::error::Google's answer holds no access token."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > "$RUNNER_TEMP/authorization"
      - name: Ask the store which version it has
        id: store
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/status.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 60 --output "$response" \
            --header @"$RUNNER_TEMP/authorization" "$ITEM:fetchStatus" ||
            { cat "$response"; echo "::error::The store didn't tell the status of the item."; exit 1; }
          # The version that is published, and the one that was submitted since.
          published="$(jq -r '.publishedItemRevisionStatus | (.distributionChannels[0].crxVersion // "none") + " (" + (.state // "none") + ")"' "$response")"
          submitted="$(jq -r '.submittedItemRevisionStatus | (.distributionChannels[0].crxVersion // "none") + " (" + (.state // "none") + ")"' "$response")"
          echo "The store has the version $published and the submission $submitted." | tee -a "$GITHUB_STEP_SUMMARY"
          version="${TAG#v}"
          if [[ "$published" == "$version ("* || "$submitted" == "$version ("* ]]; then
            echo "The store has $version already; nothing to deliver." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "The release $TAG goes to the Chrome Web Store." >> "$GITHUB_STEP_SUMMARY"

  store:
    name: deliver to the Chrome Web Store
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ vars.CWS_EXTENSION_ID }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      ITEM: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
      UPLOAD: https://chromewebstore.googleapis.com/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}:upload
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a job that publishes: a poisoned cache could reach the store.
          package-manager-cache: false
      - name: Build the upload zip of the release
        id: zip
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          # The contents of extension/ with the manifest at the root of the zip, without
          # source maps, as the store wants them.
          bash scripts/package-extension.sh
          version="${TAG#v}"
          manifest="$(jq -r .version extension/manifest.json)"
          zip="dist/player-switch-for-autodarts-$manifest.zip"
          packaged="$(unzip -p "$zip" manifest.json | jq -r .version)"
          if [[ "$manifest" != "$version" || "$packaged" != "$version" ]]; then
            echo "::error::The manifest has version $manifest, the zip version $packaged; the release is $version."
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "The zip $zip carries the version $version." >> "$GITHUB_STEP_SUMMARY"
      # What went to the store, to look at later; the release itself is immutable and
      # takes no file after it is published.
      - name: Keep the zip as an artifact of the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-web-store-${{ needs.release.outputs.tag }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
      - name: Sign in to the Chrome Web Store API
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # The same sign-in as above: a job can't hand a token to another one.
          response="$RUNNER_TEMP/token.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 60 --output "$response" \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token \
            https://oauth2.googleapis.com/token ||
            { cat "$response"; echo "::error::Google issued no access token; the refresh token may have expired."; exit 1; }
          token="$(jq -r '.access_token // empty' "$response")"
          rm -f "$response"
          if [[ -z "$token" ]]; then
            echo "::error::Google's answer holds no access token."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > "$RUNNER_TEMP/authorization"
      - name: Upload the zip
        env:
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/upload.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 600 --output "$response" \
            --header @"$RUNNER_TEMP/authorization" --request POST --upload-file "$ZIP" "$UPLOAD" ||
            { cat "$response"; echo "::error::The store refused the upload of $ZIP."; exit 1; }
          state="$(jq -r '.uploadState // empty' "$response")"
          # The store may go on processing the upload after its answer; the status of the
          # item says when it is done.
          for _ in $(seq 1 20); do
            [[ "$state" == IN_PROGRESS || "$state" == UPLOAD_IN_PROGRESS ]] || break
            sleep 15
            curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
              --connect-timeout 15 --max-time 60 --output "$response" \
              --header @"$RUNNER_TEMP/authorization" "$ITEM:fetchStatus" ||
              { cat "$response"; echo "::error::The store didn't tell the status of the upload."; exit 1; }
            state="$(jq -r '.lastAsyncUploadState // empty' "$response")"
          done
          if [[ "$state" != SUCCEEDED ]]; then
            cat "$response"
            echo "::error::The upload of $ZIP ended in the state ${state:-unknown}."
            exit 1
          fi
          echo "The store took the upload of $ZIP." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Submit the release for review
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/publish.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 120 --output "$response" \
            --header @"$RUNNER_TEMP/authorization" --header 'Content-Type: application/json' \
            --request POST --data '{}' "$ITEM:publish" ||
            { cat "$response"; echo "::error::The store refused to publish the release $TAG."; exit 1; }
          jq -r '.warningInfo.warnings[]? | "::warning::\(.reason): \(.description)"' "$response"
          state="$(jq -r '.state // empty' "$response")"
          case "$state" in
            PENDING_REVIEW)
              echo "The release $TAG is submitted; Google publishes it after its review." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            STAGED | PUBLISHED | PUBLISHED_TO_TESTERS)
              echo "The release $TAG is in the state $state." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat "$response"
              echo "::error::The submission of the release $TAG ended in the state ${state:-unknown}."
              exit 1
              ;;
          esac
