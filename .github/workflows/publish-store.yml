name: Chrome Web Store

# Delivers each release to the Chrome Web Store, where Google reviews it and then
# publishes it, and looks after it every day until the users have it. The release bot
# publishes a release with the GITHUB_TOKEN, whose events start no workflow, so this
# one starts after every run of the Release workflow that a push or a start by hand
# began, every day from the schedule, and by hand with a tag.
#
# The job "status" signs in, asks the store for the state of the item and lets
# scripts/store-status.ts decide (decision 0005): a release that the store lacks goes
# to the store when no review is pending; while one is, the run waits with a note,
# and a later day delivers the release. A rejected submission, an item that Google
# warned or took down, a review of more than 7 days, an expired refresh token and a
# store version above the release fail the run with the reason and the fix in its
# summary, and the bot-health sweep of the night keeps an issue open about it. The
# daily sign-in also keeps the refresh token in use, which Google expires after six
# months without one. The job "package" builds the upload zip from the tag with
# scripts/package-extension.sh, without any secret, checks that the manifest carries
# the version of the release and keeps the zip as an artifact of the run for 30 days.
# The job "store" uploads that zip with the Chrome Web Store API and submits it for
# review; it runs no code of the repository and no npm package.
#
# Each job lets its runner reach only the hosts that it needs, and
# scripts/check-project.sh fails when a job of this workflow goes back to recording
# the traffic only, or runs on a runner image that moves. The OAuth client and the
# refresh token of the developer account are the secrets of the environment
# chrome-web-store, the IDs of the item and of the publisher the variables
# CWS_EXTENSION_ID and CWS_PUBLISHER_ID; docs/releases.md describes the one-time
# set-up and how to renew the token.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  schedule:
    # Before the bot-health sweep of the night, which then finds a failed run.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release; empty for the latest
        required: false

permissions: {}

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

env:
  # The GitHub CLI would send its telemetry to a host that no job may reach.
  GH_TELEMETRY: "false"

jobs:
  status:
    name: the state of the store
    # A failed run of the Release workflow published no release, and its hourly runs
    # from the schedule publish none either; the daily run here looks after those.
    if: >-
      !github.event.repository.fork && (
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The secrets of the store, to ask it; the delivery below is the deployment.
    environment:
      name: chrome-web-store
      deployment: false
    permissions:
      # The script that decides, from the default branch, and the releases.
      contents: read
      # The artifact of the delivery of the version in review, for the days of its review.
      actions: read
    env:
      # The item in the Chrome Web Store API: https://developer.chrome.com/docs/webstore/api
      ITEM: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Let the job reach only the hosts that it needs
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # GitHub for the checkout, the releases and the artifacts, and for Node.js
          # should the runner image lack its version; Google for the sign-in and the
          # store. The hosts of the Actions service itself are allowed anyway.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            oauth2.googleapis.com:443
            chromewebstore.googleapis.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a job that holds the secrets of the store.
          package-manager-cache: false
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The latest release: published, no draft, no prerelease.
          tag="${INPUT_TAG:-$(gh release view --json tagName --jq .tagName 2>/dev/null || true)}"
          if [[ -z "$tag" ]]; then
            echo "The repository has no release yet." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          state="$(gh release view "$tag" --json isDraft,isPrerelease \
            --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "release" end')"
          case "$state" in
            draft)
              echo "::error::The release $tag is still a draft."
              exit 1
              ;;
            prerelease)
              # A prerelease is for the testers who take one; the store gets releases only.
              echo "The prerelease $tag stays off the store." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A tag given by hand goes to the store again after a rejection or a cancellation.
          echo "explicit=${INPUT_TAG:+true}" >> "$GITHUB_OUTPUT"
      - name: Check the set-up of the environment
        if: steps.release.outputs.tag != ''
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          missing=0
          for secret in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::The secret $secret of the environment chrome-web-store is missing; docs/releases.md says how to set it."
              missing=1
            fi
          done
          for variable in CWS_EXTENSION_ID CWS_PUBLISHER_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::The variable $variable is missing; docs/releases.md says how to set it."
              missing=1
            fi
          done
          exit "$missing"
      - name: Sign in to the Chrome Web Store API
        if: steps.release.outputs.tag != ''
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # An access token of an hour from the refresh token. It goes into a file of the
          # job for the steps below, so that it is in no log and no environment.
          response="$RUNNER_TEMP/token.json"
          if ! curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 60 --output "$response" \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token \
            https://oauth2.googleapis.com/token; then
            # The answer to a failed sign-in names the error and holds no secret.
            error="$(jq -r '.error // empty' "$response" 2>/dev/null || true)"
            rm -f "$response"
            case "$error" in
              invalid_grant)
                message="Google turned the refresh token away (invalid_grant): it has expired or was revoked, as after six months without use, a new password of the account or a consent screen in testing. Get a new one as 'Renew the refresh token' in docs/releases.md says, and set it with: gh secret set CWS_REFRESH_TOKEN --env chrome-web-store"
                ;;
              invalid_client | unauthorized_client)
                message="Google doesn't know the OAuth client ($error). Set CWS_CLIENT_ID and CWS_CLIENT_SECRET of the environment chrome-web-store again from the Google Cloud Console, as docs/releases.md says."
                ;;
              *)
                message="Google issued no access token (${error:-no answer}). Start the run again; if it fails again, renew the refresh token as docs/releases.md says."
                ;;
            esac
            echo "::error title=Chrome Web Store::$message"
            echo "- **Problem:** $message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          token="$(jq -r '.access_token // empty' "$response")"
          rm -f "$response"
          if [[ -z "$token" ]]; then
            echo "::error::Google's answer holds no access token."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > "$RUNNER_TEMP/authorization"
      - name: Ask the store for the state of the item
        id: store
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/status.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 60 --output "$status" \
            --header @"$RUNNER_TEMP/authorization" "$ITEM:fetchStatus" ||
            { cat "$status"; echo "::error::The store didn't tell the status of the item."; exit 1; }
          # When the version in review went to the store, which the store doesn't tell:
          # the artifact that this workflow kept of its delivery, or else its release.
          submitted="$(jq -r '.submittedItemRevisionStatus.distributionChannels[0].crxVersion // empty' "$status")"
          if [[ -n "$submitted" ]]; then
            at="$(gh api "repos/$GH_REPO/actions/artifacts?name=chrome-web-store-v$submitted&per_page=100" \
              --jq '[.artifacts[].created_at] | max // empty' 2>/dev/null || true)"
            from=delivery
            if [[ -z "$at" ]]; then
              at="$(gh release view "v$submitted" --json publishedAt --jq .publishedAt 2>/dev/null || true)"
              from=release
            fi
            if [[ -n "$at" ]]; then
              echo "at=$at" >> "$GITHUB_OUTPUT"
              echo "from=$from" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Decide what to deliver
        id: decide
        if: steps.release.outputs.tag != ''
        env:
          STATUS: ${{ runner.temp }}/status.json
          TAG: ${{ steps.release.outputs.tag }}
          EXPLICIT: ${{ steps.release.outputs.explicit }}
          SUBMITTED_AT: ${{ steps.store.outputs.at }}
          SUBMITTED_FROM: ${{ steps.store.outputs.from }}
        run: node scripts/store-status.ts

  package:
    name: the package of the release
    needs: status
    # A warned item still gets the release that may fix it, while its run fails.
    if: ${{ !cancelled() && needs.status.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.status.outputs.tag }}
    outputs:
      zip: ${{ steps.zip.outputs.zip }}
    steps:
      - name: Let the job reach only the hosts that it needs
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # GitHub for the checkout, and for Node.js should the runner image lack its
          # version; npm for the dependencies of the build. The hosts of the Actions
          # service itself, which keeps the artifact, are allowed anyway.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.status.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a job whose package reaches the store: a poisoned cache could.
          package-manager-cache: false
      - name: Build the upload zip of the release
        id: zip
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          # The contents of extension/ with the manifest at the root of the zip, without
          # source maps, as the store wants them.
          bash scripts/package-extension.sh
          version="${TAG#v}"
          manifest="$(jq -r .version extension/manifest.json)"
          zip="player-switch-for-autodarts-$manifest.zip"
          packaged="$(unzip -p "dist/$zip" manifest.json | jq -r .version)"
          if [[ "$manifest" != "$version" || "$packaged" != "$version" ]]; then
            echo "::error::The manifest has version $manifest, the zip version $packaged; the release is $version."
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "The zip $zip carries the version $version." >> "$GITHUB_STEP_SUMMARY"
      # What went to the store, to look at later, and when: the job "status" counts the
      # days of the review from it. The release itself is immutable and takes no file
      # after it is published.
      - name: Keep the zip as an artifact of the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-web-store-${{ needs.status.outputs.tag }}
          path: dist/${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

  store:
    name: deliver to the Chrome Web Store
    needs: [status, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ vars.CWS_EXTENSION_ID }}
    permissions:
      # The artifact of the job "package".
      actions: read
    env:
      TAG: ${{ needs.status.outputs.tag }}
      ZIP: dist/${{ needs.package.outputs.zip }}
      ITEM: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
      UPLOAD: https://chromewebstore.googleapis.com/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}:upload
    steps:
      - name: Let the job reach only the hosts that it needs
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # Google for the sign-in and the store, nothing else: this job holds the
          # token that publishes to every user. The hosts of the Actions service
          # itself, which hands out the artifact, are allowed anyway.
          allowed-endpoints: >
            oauth2.googleapis.com:443
            chromewebstore.googleapis.com:443
      - name: Take the zip that the job "package" built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-web-store-${{ needs.status.outputs.tag }}
          path: dist
      - name: Sign in to the Chrome Web Store API
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # The same sign-in as in the job "status": a job can't hand a token to another.
          response="$RUNNER_TEMP/token.json"
          if ! curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 60 --output "$response" \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token \
            https://oauth2.googleapis.com/token; then
            error="$(jq -r '.error // empty' "$response" 2>/dev/null || true)"
            rm -f "$response"
            echo "::error title=Chrome Web Store::Google issued no access token (${error:-no answer}), minutes after it issued one to the job 'status'. Start the run again, or the daily run delivers $TAG."
            exit 1
          fi
          token="$(jq -r '.access_token // empty' "$response")"
          rm -f "$response"
          if [[ -z "$token" ]]; then
            echo "::error::Google's answer holds no access token."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > "$RUNNER_TEMP/authorization"
      - name: Upload the zip
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/upload.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 600 --output "$response" \
            --header @"$RUNNER_TEMP/authorization" --request POST --upload-file "$ZIP" "$UPLOAD" ||
            { cat "$response"; echo "::error::The store refused the upload of $ZIP."; exit 1; }
          state="$(jq -r '.uploadState // empty' "$response")"
          # The store may go on processing the upload after its answer; the status of the
          # item says when it is done.
          for _ in $(seq 1 20); do
            [[ "$state" == IN_PROGRESS || "$state" == UPLOAD_IN_PROGRESS ]] || break
            sleep 15
            curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
              --connect-timeout 15 --max-time 60 --output "$response" \
              --header @"$RUNNER_TEMP/authorization" "$ITEM:fetchStatus" ||
              { cat "$response"; echo "::error::The store didn't tell the status of the upload."; exit 1; }
            state="$(jq -r '.lastAsyncUploadState // empty' "$response")"
          done
          if [[ "$state" != SUCCEEDED ]]; then
            cat "$response"
            echo "::error::The upload of $ZIP ended in the state ${state:-unknown}."
            exit 1
          fi
          echo "The store took the upload of $ZIP." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Submit the release for review
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/publish.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 120 --output "$response" \
            --header @"$RUNNER_TEMP/authorization" --header 'Content-Type: application/json' \
            --request POST --data '{}' "$ITEM:publish" ||
            { cat "$response"; echo "::error::The store refused to publish the release $TAG."; exit 1; }
          jq -r '.warningInfo.warnings[]? | "::warning::\(.reason): \(.description)"' "$response"
          state="$(jq -r '.state // empty' "$response")"
          case "$state" in
            PENDING_REVIEW)
              echo "The release $TAG is submitted; Google publishes it after its review, and the daily run reports how the review goes." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            STAGED | PUBLISHED | PUBLISHED_TO_TESTERS)
              echo "The release $TAG is in the state $state." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat "$response"
              echo "::error::The submission of the release $TAG ended in the state ${state:-unknown}."
              exit 1
              ;;
          esac
