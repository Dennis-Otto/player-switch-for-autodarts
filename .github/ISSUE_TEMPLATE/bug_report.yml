name: Bug report
description: Something doesn't work as documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Within a few minutes, the issue assistant posts a first analysis and may ask questions; the maintainer reads every issue as well ([what happens with your issue](https://github.com/Dennis-Otto/player-switch-for-autodarts/blob/main/SUPPORT.md#what-happens-with-your-issue)).

        **Never post** tokens, keys, passwords or other personal data. Report a vulnerability privately, as described in [SECURITY.md](https://github.com/Dennis-Otto/player-switch-for-autodarts/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Switching players
        - Adding an account
        - The switcher on the Autodarts page
        - Join the lobby
        - Venue mode for a club or pub
        - Remembered password
        - Install or update
        - Firefox or Edge
        - Website or documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you use. "Report a problem" in the popup of the extension fills it in.
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: The browser and its version; the extension needs Chrome or Edge 140, or Firefox 153, or newer. "Report a problem" in the popup of the extension fills it in.
      placeholder: "Google Chrome 154"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The steps that make the problem happen again, as far as you know them.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        In the popup, open Manage accounts, choose Copy diagnostics at its bottom and paste
        the copy here: the versions, how each account stands and the last 50 events of the
        extension, without a name, a token or a password
        (https://dennis-otto.github.io/player-switch-for-autodarts/help.html#report).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I removed tokens, keys and personal data from everything I posted.
          required: true
